name: Versionado Semántico Automático

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Aumentar versión
        run: |
          # 1. Limpiar caracteres extraños (UTF-16 a UTF-8)
          sed -i 's/\x0//g' package.json
          
          # 2. Cambiar la versión de 1.0.0 a 1.1.0
          sed -i 's/"version": "1.0.0"/"version": "1.1.0"/' package.json
          
          # 3. Subir cambios
          git add package.json
          git commit -m "chore: bump version to 1.1.0 [skip ci]"
          git push origin main