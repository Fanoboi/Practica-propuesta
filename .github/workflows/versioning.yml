name: Versionado Semántico Automático

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          # Esto le da al robot permiso total para volver a subir el cambio
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Aumentar versión
        run: |
          # Un script de Node súper simple para actualizar el archivo
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); const parts = pkg.version.split('.'); parts[1] = parseInt(parts[1]) + 1; parts[2] = 0; pkg.version = parts.join('.'); fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
          
          # Subir el cambio a GitHub
          git add package.json
          git commit -m "chore: bump version [skip ci]"
          git push origin main