name: Versionado Semántico Automático

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Aumentar versión (Minor)
        run: |
          # Extraer la versión actual de forma segura
          OLD_VERSION=$(node -p "require('./package.json').version")
          echo "Versión anterior: $OLD_VERSION"
          
          # Calcular la nueva versión (1.0.0 -> 1.1.0)
          # Usamos un pequeño script de Node para no fallar con sed
          NEW_VERSION=$(node -p "const v = '$OLD_VERSION'.split('.'); v[1] = parseInt(v[1]) + 1; v[2] = 0; v.join('.')")
          echo "Nueva versión: $NEW_VERSION"
          
          # Actualizar el package.json usando Node para mantener el formato
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8')); pkg.version = '$NEW_VERSION'; fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');"
          
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin main